name: 每日AI新闻推送

on:
  schedule:
    # 北京时间每天早上 8:30 (UTC 00:30)
    - cron: "30 0 * * *"
  workflow_dispatch:  # 允许手动触发测试

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run news push
        env:
          ILINK_BOT_TOKEN: ${{ secrets.ILINK_BOT_TOKEN }}
          ILINK_USER_ID: ${{ secrets.ILINK_USER_ID }}
        run: python push_news.py
